<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>월광난투 — Moonlight Brawl</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #04040f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; background: #04040f; }
  .corner {
    position: fixed; right: 14px; bottom: 12px; z-index: 10;
    color: #6a5a90; font-size: 12px; text-decoration: none; letter-spacing: 1px;
    opacity: 0.7; transition: opacity 0.2s;
  }
  .corner:hover { opacity: 1; color: #c0b0e0; }
</style>
</head>
<body>
<canvas id="cv" width="1280" height="720"></canvas>
<a class="corner" href="moodboard.html">🌙 무드보드 보기</a>

<script>
'use strict';
const cv = document.getElementById('cv'), cx = cv.getContext('2d');
const W = 1280, H = 720;

function fitCanvas() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
addEventListener('resize', fitCanvas); fitCanvas();

// ───────── 입력 (e.code 사용: 한글 IME 영향 없음) ─────────
const keys = {}; let prevKeys = {};
const BLOCK = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'];
addEventListener('keydown', e => {
  if (BLOCK.includes(e.code)) e.preventDefault();
  keys[e.code] = true; initAudio();
});
addEventListener('keyup', e => { delete keys[e.code]; });
const kd = c => !!keys[c];
const jp = c => !!keys[c] && !prevKeys[c];
const jpAny = arr => arr.some(jp);
const kdAny = arr => arr.some(kd);

// ───────── 오디오 (Web Audio 합성) ─────────
let AC = null;
function initAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function tone(freq, dur, type = 'sine', vol = 0.15, slide = 0) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, AC.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), AC.currentTime + dur);
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(); o.stop(AC.currentTime + dur);
}
function noiseBurst(dur, vol = 0.2) {
  if (!AC) return;
  const n = AC.sampleRate * dur, buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(), g = AC.createGain();
  s.buffer = buf; g.gain.value = vol;
  s.connect(g); g.connect(AC.destination); s.start();
}
const sfx = {
  jump: () => tone(300, 0.12, 'square', 0.06, 250),
  hit: p => { noiseBurst(0.08, 0.18); tone(160 + p * 0.8, 0.12, 'sawtooth', 0.1, -80); },
  ko: () => { noiseBurst(0.4, 0.3); tone(400, 0.55, 'sawtooth', 0.2, -360); },
  blip: () => tone(520, 0.07, 'square', 0.07),
  go: () => tone(780, 0.2, 'square', 0.1, 200),
  perk: () => { tone(523, 0.1, 'sine', 0.1); setTimeout(() => tone(659, 0.1, 'sine', 0.1), 90); setTimeout(() => tone(784, 0.16, 'sine', 0.1), 180); },
  shield: () => tone(900, 0.25, 'triangle', 0.12, -500),
};

// ───────── 데이터 ─────────
const CHARS = [
  { emoji: '🐇', name: '달토끼', desc: '균형 잡힌 만능형', spd: 1.0, pow: 1.0, wgt: 1.0, jumps: 2, r: 24 },
  { emoji: '🦊', name: '별여우', desc: '빠르지만 가벼움', spd: 1.28, pow: 0.82, wgt: 0.82, jumps: 2, r: 21 },
  { emoji: '🐢', name: '현무', desc: '느리지만 강력함', spd: 0.78, pow: 1.32, wgt: 1.38, jumps: 2, r: 29 },
  { emoji: '🦉', name: '야부엉', desc: '삼단 점프의 달인', spd: 0.98, pow: 0.92, wgt: 0.9, jumps: 3, r: 23 },
];
const PCFG = [
  { label: 'P1', color: '#4fc3f7', left: 'KeyA', right: 'KeyD', up: 'KeyW', down: 'KeyS', atk: ['KeyF', 'KeyG'], help: '이동 A/D · 점프 W · 아래 S · 공격 F' },
  { label: 'P2', color: '#f87171', left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', down: 'ArrowDown', atk: ['Period', 'Slash'], help: '이동 ←/→ · 점프 ↑ · 아래 ↓ · 공격 . (마침표)' },
  { label: 'P3', color: '#fbbf24', left: 'KeyJ', right: 'KeyL', up: 'KeyI', down: 'KeyK', atk: ['KeyO', 'Semicolon'], help: '이동 J/L · 점프 I · 아래 K · 공격 O' },
];
const PERKS = [
  { id: 'spd',   icon: '💨', name: '질풍신뢰', desc: '이동 속도 +15%',            apply: p => p.spdMul *= 1.15 },
  { id: 'pow',   icon: '💪', name: '괴력',     desc: '공격력 +15%',              apply: p => p.powMul *= 1.15 },
  { id: 'wgt',   icon: '🛡️', name: '강골',     desc: '밀려나는 거리 -15%',       apply: p => p.wgtMul *= 1.18 },
  { id: 'cd',    icon: '⚡', name: '연속베기', desc: '공격 쿨타임 -25%',         apply: p => p.cdMul *= 0.75 },
  { id: 'jump3', icon: '🕊️', name: '허공답보', desc: '공중 점프 +1회',           apply: p => p.extraJumps += 1 },
  { id: 'leech', icon: '🌙', name: '흡성대법', desc: '타격 시 내 피해 4% 회복',  apply: p => p.leech += 4 },
  { id: 'spike', icon: '☄️', name: '유성추',   desc: '공중 ↓+공격 = 내리찍기',   apply: p => p.spike = true, unique: true },
  { id: 'thorn', icon: '🌵', name: '가시갑옷', desc: '나를 때린 상대 피해 +5%',  apply: p => p.thorns += 5 },
  { id: 'shield',icon: '✨', name: '별의가호', desc: '라운드마다 첫 피격 무효',  apply: p => p.shieldPerk = true, unique: true },
  { id: 'range', icon: '🗡️', name: '월광장검', desc: '공격 범위 +25%',           apply: p => p.rangeMul *= 1.25 },
  { id: 'jmp',   icon: '🦵', name: '경공술',   desc: '점프력 +12%',              apply: p => p.jumpMul *= 1.12 },
  { id: 'giant', icon: '🌕', name: '거인화',   desc: '몸집·공격력 증가, 잘 맞음', apply: p => { p.sizeMul *= 1.15; p.powMul *= 1.1; } },
];
const PLATFORMS = [
  { x: 150, y: 560, w: 980, drop: false },
  { x: 300, y: 425, w: 200, drop: true },
  { x: 780, y: 425, w: 200, drop: true },
  { x: 565, y: 315, w: 150, drop: true },
];
const SPAWNS = [[340, 480], [640, 480], [940, 480]];
const GRAV = 0.42, FALLCAP = 13, WINS_NEEDED = 3, STOCKS = 2;

// ───────── 배경 요소 ─────────
const stars = [];
for (let i = 0; i < 150; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + 0.4, ph: Math.random() * 6.28, sp: 0.02 + Math.random() * 0.04 });
let shooting = [];

// ───────── 상태 ─────────
let state = 'menu';
let slots = [
  { type: 1, char: 0 },  // 0=off 1=human 2=ai
  { type: 2, char: 1 },
  { type: 0, char: 2 },
];
let players = [], roundNum = 1, frame = 0;
let hitstop = 0, slowmo = 0, shakeT = 0, shakeDur = 1, shakeMag = 0;
let countdownT = 0, goT = 0, bannerT = 0, bannerText = '', bannerEmoji = '';
let particles = [], dmgNums = [];
let blessing = null, matchWinner = null, deathOrder = [];

function shake(t, m) { shakeT = t; shakeDur = t; shakeMag = Math.max(shakeMag, m); }

// ───────── 플레이어 ─────────
function makePlayer(slotIdx) {
  const slot = slots[slotIdx], ch = CHARS[slot.char], cfg = PCFG[slotIdx];
  return {
    idx: slotIdx, cfg, ch, ai: slot.type === 2,
    x: 0, y: 0, vx: 0, vy: 0, dir: 1,
    dmg: 0, stocks: STOCKS, wins: 0, kos: 0,
    onGround: false, airJumps: 0, stun: 0, inv: 0, hover: 0,
    atkCD: 0, atkWind: 0, atkActive: 0, atkAnim: 0, atkAim: 0, hitSet: null, aimMode: 'side',
    dropT: 0, out: false, deadT: 0, lastHitBy: null, shieldUp: false,
    // 퍽 스탯
    perks: [], spdMul: 1, powMul: 1, wgtMul: 1, cdMul: 1, rangeMul: 1, jumpMul: 1, sizeMul: 1,
    extraJumps: 0, leech: 0, thorns: 0, spike: false, shieldPerk: false,
    in: { l: 0, r: 0, u: 0, d: 0, a: 0 }, pin: { l: 0, r: 0, u: 0, d: 0, a: 0 },
    aiState: { t: 0, wantJump: false, dodge: 0 },
  };
}
const R = p => p.ch.r * p.sizeMul;
const SPD = p => 5.4 * p.ch.spd * p.spdMul;
const POW = p => p.ch.pow * p.powMul;
const WGT = p => p.ch.wgt * p.wgtMul;
const RANGE = p => (R(p) + 34) * p.rangeMul;
const MAXJ = p => p.ch.jumps + p.extraJumps;

// ───────── 흐름 ─────────
function startMatch() {
  players = [];
  slots.forEach((s, i) => { if (s.type > 0) players.push(makePlayer(i)); });
  roundNum = 1; matchWinner = null;
  players.forEach(p => { p.wins = 0; p.kos = 0; });
  startRound();
}
function startRound() {
  deathOrder = [];
  players.forEach((p, i) => {
    const sp = SPAWNS[players.length === 2 ? i + (i > 0 ? 1 : 0) : i];
    p.x = sp[0]; p.y = sp[1] - R(p); p.vx = 0; p.vy = 0;
    p.dmg = 0; p.stocks = STOCKS; p.out = false; p.deadT = 0;
    p.stun = 0; p.inv = 0; p.hover = 0; p.atkCD = 0; p.atkActive = 0; p.atkAnim = 0;
    p.dir = p.x < W / 2 ? 1 : -1;
    p.shieldUp = p.shieldPerk;
  });
  particles = []; dmgNums = [];
  state = 'countdown'; countdownT = 165; goT = 0;
}
function endRoundCheck() {
  const alive = players.filter(p => !p.out);
  if (alive.length > 1) return;
  const winner = alive[0] || deathOrder[deathOrder.length - 1];
  winner.wins++;
  slowmo = 45;
  bannerT = 130; bannerEmoji = winner.ch.emoji;
  if (winner.wins >= WINS_NEEDED) {
    bannerText = `${winner.ch.name} 최종 승리!`;
    matchWinner = winner;
  } else {
    bannerText = `${winner.ch.name} 라운드 승리!`;
  }
  state = 'roundend';
}
function setupBlessing() {
  const winner = players.reduce((a, b) => a.wins >= b.wins ? a : b);
  const roundWinner = players.find(p => !p.out) || deathOrder[deathOrder.length - 1];
  const pickers = players.filter(p => p !== roundWinner).map(p => {
    const owned = new Set(p.perks.map(pk => pk.id));
    const pool = PERKS.filter(pk => !(pk.unique && owned.has(pk.id)));
    const cards = [];
    const bag = [...pool];
    for (let i = 0; i < 3 && bag.length; i++) cards.push(bag.splice(Math.floor(Math.random() * bag.length), 1)[0]);
    return { p, cards, sel: 1, done: false, aiT: 70 + Math.random() * 50 };
  });
  blessing = { pickers };
  state = 'blessing';
}

// ───────── AI ─────────
function aiThink(p) {
  const a = p.aiState;
  const foes = players.filter(o => o !== p && !o.out && o.deadT <= 0);
  p.in = { l: 0, r: 0, u: 0, d: 0, a: 0 };
  if (!foes.length) return;
  let t = foes[0], best = 1e9;
  foes.forEach(f => { const d = Math.abs(f.x - p.x) + Math.abs(f.y - p.y) * 0.6; if (d < best) { best = d; t = f; } });
  const dx = t.x - p.x, dy = t.y - p.y;
  const feet = p.y + R(p);
  const onStage = p.x > 150 && p.x < 1130;

  // 복귀 최우선
  if (!onStage || feet > 600) {
    if (p.x < W / 2) p.in.r = 1; else p.in.l = 1;
    if (p.vy > 1 && (p.airJumps > 0 || p.onGround)) p.in.u = 1;
    return;
  }
  a.t--;
  if (a.t <= 0) { a.t = 8 + Math.random() * 10; a.dodge = Math.random() < 0.12 ? 20 : 0; }
  // 접근
  if (a.dodge > 0) { a.dodge--; if (dx > 0) p.in.l = 1; else p.in.r = 1; }
  else if (Math.abs(dx) > 46) { if (dx > 0) p.in.r = 1; else p.in.l = 1; }
  // 점프 판단
  if (p.onGround && dy < -70 && Math.random() < 0.08) p.in.u = 1;
  if (!p.onGround && p.vy > 0 && dy < -50 && p.airJumps > 0 && Math.random() < 0.05) p.in.u = 1;
  // 공격
  if (Math.abs(dx) < RANGE(p) + 14 && Math.abs(dy) < 56 && p.atkCD <= 0) {
    p.dir = dx >= 0 ? 1 : -1;
    p.in.a = 1;
    if (dy < -26) p.in.u = 0, p.in.uAim = 1;
  }
  // 내리찍기
  if (p.spike && !p.onGround && dy > 40 && Math.abs(dx) < 40 && p.atkCD <= 0) { p.in.d = 1; p.in.a = 1; }
}

// ───────── 전투 처리 ─────────
function tryAttack(p) {
  if (p.atkCD > 0 || p.stun > 0) return;
  p.atkCD = Math.round(28 * p.cdMul);
  p.atkWind = 2;
  p.hitSet = new Set();
  const upHold = p.in.u || p.in.uAim, dnHold = p.in.d;
  if (p.spike && !p.onGround && dnHold) p.aimMode = 'spike';
  else if (upHold) p.aimMode = 'up';
  else p.aimMode = 'side';
  p.atkAnim = 13;
}
function aimVec(p) {
  if (p.aimMode === 'spike') return [0, 1];
  if (p.aimMode === 'up') return [p.dir * 0.4, -0.92];
  return [p.dir, -0.1];
}
function applyHit(att, vic) {
  if (vic.inv > 0) return;
  if (vic.shieldUp) {
    vic.shieldUp = false; sfx.shield();
    burst(vic.x, vic.y, '#a0e8ff', 18, 4);
    dmgNums.push({ x: vic.x, y: vic.y - R(vic) - 12, txt: '보호막!', t: 50, color: '#a0e8ff' });
    hitstop = 5; return;
  }
  const dmgAmt = Math.round((8 + Math.random() * 3) * POW(att));
  vic.dmg += dmgAmt;
  vic.lastHitBy = att;
  if (att.leech > 0) att.dmg = Math.max(0, att.dmg - att.leech);
  if (vic.thorns > 0) att.dmg += vic.thorns;
  let kb = Math.min(30, (4.5 + vic.dmg * 0.12) * POW(att) / WGT(vic));
  const dirX = vic.x >= att.x ? 1 : -1;
  if (att.aimMode === 'spike' && !vic.onGround) {
    vic.vx = dirX * kb * 0.25; vic.vy = kb * 0.95;
  } else if (att.aimMode === 'up') {
    vic.vx = dirX * kb * 0.45; vic.vy = -kb * 1.0;
  } else {
    vic.vx = dirX * kb; vic.vy = -kb * 0.6;
  }
  vic.stun = 9 + kb * 1.1;
  vic.onGround = false;
  hitstop = 6; shake(8, 4 + kb * 0.35);
  burst(vic.x, vic.y, att.cfg.color, 12, 5);
  dmgNums.push({ x: vic.x, y: vic.y - R(vic) - 10, txt: dmgAmt + '%', t: 45, color: dmgColor(vic.dmg) });
  sfx.hit(vic.dmg);
}
function dmgColor(d) {
  if (d < 50) return '#ffffff';
  if (d < 90) return '#fbbf24';
  if (d < 130) return '#fb7185';
  return '#ef4444';
}
function doKO(p) {
  p.stocks--;
  sfx.ko(); shake(22, 14); hitstop = 10;
  const ex = Math.max(30, Math.min(W - 30, p.x)), ey = Math.max(30, Math.min(H - 30, p.y));
  burst(ex, ey, p.cfg.color, 40, 9);
  burst(ex, ey, '#ffffff', 20, 7);
  if (p.lastHitBy) p.lastHitBy.kos++;
  if (p.stocks > 0) {
    p.deadT = 55;
  } else {
    p.out = true;
    deathOrder.push(p);
  }
}
function respawn(p) {
  p.x = W / 2; p.y = 60; p.vx = 0; p.vy = 0;
  p.dmg = 0; p.stun = 0; p.inv = 130; p.hover = 42;
  p.airJumps = MAXJ(p) - 1;
  burst(p.x, p.y, '#ffffff', 14, 3);
}

// ───────── 파티클 ─────────
function burst(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, s = Math.random() * spd + 1;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, max: 24 + Math.random() * 22, color, size: 1.5 + Math.random() * 3, grav: 0.12 });
  }
}
function dust(x, y, n = 4) {
  for (let i = 0; i < n; i++) particles.push({ x: x + (Math.random() - 0.5) * 16, y, vx: (Math.random() - 0.5) * 1.6, vy: -Math.random() * 1.2, t: 0, max: 18 + Math.random() * 10, color: '#8a8aa0', size: 1.5 + Math.random() * 2, grav: -0.005 });
}

// ───────── 물리 & 전투 업데이트 ─────────
function updateWorld() {
  if (hitstop > 0) { hitstop--; return; }

  players.forEach(p => {
    if (p.out) return;
    if (p.deadT > 0) { p.deadT--; if (p.deadT === 0) respawn(p); return; }

    // 입력
    p.pin = { ...p.in };
    if (p.ai) aiThink(p);
    else {
      const c = p.cfg;
      p.in = { l: kd(c.left) ? 1 : 0, r: kd(c.right) ? 1 : 0, u: kd(c.up) ? 1 : 0, d: kd(c.down) ? 1 : 0, a: kdAny(c.atk) ? 1 : 0 };
    }
    const jpu = p.in.u && !p.pin.u, jpa = p.in.a && !p.pin.a, jpd = p.in.d && !p.pin.d;

    if (p.inv > 0) p.inv--;
    if (p.atkCD > 0) p.atkCD--;
    if (p.atkAnim > 0) p.atkAnim--;
    if (p.dropT > 0) p.dropT--;

    // 호버 (리스폰 직후)
    if (p.hover > 0) {
      p.hover--;
      p.y += Math.sin(frame * 0.15) * 0.4;
      if (p.in.l || p.in.r || jpu) p.hover = 0;
      return;
    }

    const stunned = p.stun > 0;
    if (stunned) p.stun--;

    // 이동
    if (!stunned) {
      const acc = 0.9 * p.ch.spd;
      if (p.in.l) { p.vx -= acc; p.dir = -1; }
      if (p.in.r) { p.vx += acc; p.dir = 1; }
      const mx = SPD(p);
      if (p.vx > mx) p.vx = mx; if (p.vx < -mx) p.vx = -mx;
      if (!p.in.l && !p.in.r) p.vx *= p.onGround ? 0.78 : 0.97;

      // 점프
      if (jpu) {
        if (p.onGround) {
          p.vy = -11.2 * p.jumpMul; p.onGround = false; sfx.jump(); dust(p.x, p.y + R(p), 6);
        } else if (p.airJumps > 0) {
          p.airJumps--; p.vy = -10.2 * p.jumpMul; sfx.jump();
          burst(p.x, p.y + R(p) * 0.7, '#e8e0ff', 8, 2.5);
        }
      }
      // 아래로 통과
      if (jpd && p.onGround && p.curPlat && p.curPlat.drop) {
        p.dropT = 12; p.onGround = false; p.y += 5;
      }
      // 공격
      if (jpa) tryAttack(p);
    } else {
      p.vx *= 0.985;
    }

    // 중력
    p.vy += GRAV;
    if (p.vy > FALLCAP) p.vy = FALLCAP;

    const prevFeet = p.y + R(p);
    p.x += p.vx; p.y += p.vy;
    const feet = p.y + R(p);

    // 착지
    const wasAir = !p.onGround;
    p.onGround = false; p.curPlat = null;
    if (p.vy >= 0 && p.dropT <= 0) {
      for (const pl of PLATFORMS) {
        if (prevFeet <= pl.y + 5 && feet >= pl.y && p.x > pl.x - 6 && p.x < pl.x + pl.w + 6) {
          p.y = pl.y - R(p); p.vy = 0; p.onGround = true; p.curPlat = pl;
          p.airJumps = MAXJ(p) - 1;
          if (wasAir) dust(p.x, pl.y, 5);
          break;
        }
      }
    }

    // 달리기 먼지
    if (p.onGround && Math.abs(p.vx) > 3 && frame % 6 === 0) dust(p.x - p.dir * R(p) * 0.5, p.y + R(p), 1);

    // 공격 판정
    if (p.atkWind > 0) { p.atkWind--; if (p.atkWind === 0) p.atkActive = 7; }
    else if (p.atkActive > 0) {
      p.atkActive--;
      const [ax, ay] = aimVec(p);
      const range = RANGE(p);
      const hx = p.x + ax * range * 0.6, hy = p.y + ay * range * 0.6;
      players.forEach(v => {
        if (v === p || v.out || v.deadT > 0 || p.hitSet.has(v.idx)) return;
        const dx = v.x - hx, dy = v.y - hy;
        if (dx * dx + dy * dy < Math.pow(range * 0.85 + R(v), 2)) {
          p.hitSet.add(v.idx);
          applyHit(p, v);
        }
      });
    }

    // 낙사 판정
    if (p.x < -70 || p.x > W + 70 || p.y > H + 70 || p.y < -320) {
      doKO(p);
    }
  });

  // 파티클
  particles = particles.filter(pt => {
    pt.t++; pt.x += pt.vx; pt.y += pt.vy; pt.vy += pt.grav; pt.vx *= 0.97;
    return pt.t < pt.max;
  });
  dmgNums = dmgNums.filter(d => { d.t--; d.y -= 0.7; return d.t > 0; });

  if (state === 'fight') endRoundCheck();
}

function drawPlayer(p) {
  if (p.out || p.deadT > 0) return;
  const r = R(p);
  if (p.inv > 0 && Math.floor(frame / 4) % 2 === 0) cx.globalAlpha = 0.35;

  // 그림자
  let shadowY = null;
  for (const pl of PLATFORMS) {
    if (p.x > pl.x && p.x < pl.x + pl.w && pl.y >= p.y + r - 2) { shadowY = pl.y; break; }
  }
  if (shadowY !== null) {
    const dist = Math.min(1, (shadowY - p.y) / 300);
    cx.fillStyle = `rgba(0,0,0,${0.35 * (1 - dist * 0.7)})`;
    cx.beginPath(); cx.ellipse(p.x, shadowY + 3, r * (1 - dist * 0.4), r * 0.22, 0, 0, 6.28); cx.fill();
  }

  // 스턴 시 흔들림
  const wob = p.stun > 0 ? Math.sin(frame * 1.4) * 2 : 0;

  // 링
  cx.strokeStyle = p.cfg.color; cx.lineWidth = 3;
  cx.globalAlpha *= 0.9;
  cx.beginPath(); cx.arc(p.x + wob, p.y, r + 4, 0, 6.28); cx.stroke();
  cx.globalAlpha = p.inv > 0 && Math.floor(frame / 4) % 2 === 0 ? 0.35 : 1;

  // 보호막
  if (p.shieldUp) {
    cx.strokeStyle = 'rgba(160,232,255,0.8)'; cx.lineWidth = 2;
    cx.setLineDash([6, 5]); cx.lineDashOffset = -frame * 0.4;
    cx.beginPath(); cx.arc(p.x, p.y, r + 10, 0, 6.28); cx.stroke();
    cx.setLineDash([]);
  }

  // 몸통 (이모지)
  cx.font = `${r * 2}px serif`;
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.save();
  cx.translate(p.x + wob, p.y);
  if (p.dir === -1) cx.scale(-1, 1);
  cx.fillText(p.ch.emoji, 0, 2);
  cx.restore();

  // 초승달 베기 이펙트
  if (p.atkAnim > 0) {
    const a = p.atkAnim / 13;
    const [ax, ay] = aimVec(p);
    const ang = Math.atan2(ay, ax);
    const range = RANGE(p);
    cx.save();
    cx.translate(p.x, p.y);
    cx.strokeStyle = `rgba(240,235,255,${a * 0.9})`;
    cx.lineWidth = 2 + 8 * a;
    cx.lineCap = 'round';
    cx.beginPath(); cx.arc(0, 0, range * 0.85, ang - 0.85, ang + 0.85); cx.stroke();
    cx.strokeStyle = `rgba(167,139,250,${a * 0.55})`;
    cx.lineWidth = 1 + 3 * a;
    cx.beginPath(); cx.arc(0, 0, range * 0.95, ang - 0.65, ang + 0.65); cx.stroke();
    cx.restore();
  }

  // 라벨
  cx.font = 'bold 11px sans-serif';
  cx.fillStyle = p.cfg.color;
  cx.fillText(p.ai ? p.cfg.label + '·AI' : p.cfg.label, p.x, p.y - r - 14);
  cx.globalAlpha = 1;

  // 화면 위 이탈 표시
  if (p.y < -20) {
    cx.fillStyle = p.cfg.color;
    cx.beginPath();
    cx.moveTo(p.x, 10); cx.lineTo(p.x - 9, 26); cx.lineTo(p.x + 9, 26);
    cx.closePath(); cx.fill();
    cx.font = '13px sans-serif';
    cx.fillText(Math.round(-p.y) + 'm', p.x, 40);
  }
}
function drawParticles() {
  particles.forEach(pt => {
    cx.globalAlpha = 1 - pt.t / pt.max;
    cx.fillStyle = pt.color;
    cx.beginPath(); cx.arc(pt.x, pt.y, pt.size * (1 - pt.t / pt.max * 0.5), 0, 6.28); cx.fill();
  });
  cx.globalAlpha = 1;
  dmgNums.forEach(d => {

}

function updateBlessing() {
  blessing.pickers.forEach(pk => {
    if (pk.done) return;
    if (pk.p.ai) {
      pk.aiT--;
      if (pk.aiT % 30 === 0 && pk.aiT > 20) { pk.sel = Math.floor(Math.random() * pk.cards.length); sfx.blip(); }
      if (pk.aiT <= 0) confirmPick(pk);
    } else {
      const c = pk.p.cfg;
      if (jp(c.left)) { pk.sel = (pk.sel + pk.cards.length - 1) % pk.cards.length; sfx.blip(); }
      if (jp(c.right)) { pk.sel = (pk.sel + 1) % pk.cards.length; sfx.blip(); }
      if (jpAny(c.atk)) confirmPick(pk);
    }
  });
  if (blessing.pickers.every(pk => pk.done)) {
    roundNum++;
    startRound();
  }
}
function confirmPick(pk) {
  const perk = pk.cards[pk.sel];
  perk.apply(pk.p);
  pk.p.perks.push(perk);
  pk.done = true;
  sfx.perk();
}

  else if (state === 'countdown') {
    countdownT--;
    if (countdownT === 120 || countdownT === 60) sfx.blip();
    if (countdownT === 165) sfx.blip();
    if (countdownT <= 0) { state = 'fight'; goT = 32; sfx.go(); }
    drawWorldFrame();
    const num = countdownT > 120 ? 3 : countdownT > 60 ? 2 : 1;
    const sub = countdownT % 60;
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.font = `bold ${90 + sub * 0.6}px sans-serif`;
    cx.globalAlpha = Math.min(1, sub / 18);
    cx.fillStyle = '#f0e6c8';
    cx.fillText(num, W / 2, H / 2 - 40);
    cx.globalAlpha = 1;
    cx.font = 'bold 22px sans-serif'; cx.fillStyle = '#8a7ab0';
    cx.fillText(`ROUND ${roundNum}`, W / 2, H / 2 + 46);
  }
  else if (state === 'fight' || state === 'roundend') {
    let runPhysics = true;
    if (slowmo > 0) { slowmo--; if (frame % 3 !== 0) runPhysics = false; }
    if (runPhysics) updateWorld();
    drawWorldFrame();
    if (goT > 0) {
      goT--;
      cx.textAlign = 'center'; cx.font = 'bold 80px sans-serif';
      cx.globalAlpha = Math.min(1, goT / 10);
      cx.fillStyle = '#a78bfa';
      cx.fillText('GO!', W / 2, H / 2 - 40);
      cx.globalAlpha = 1;
    }
    drawBannerText();
    if (state === 'roundend') {
      bannerT--;
      if (bannerT <= 0) {
        if (matchWinner) state = 'matchend';
        else setupBlessing();
      }
    }
    if (jp('Escape')) state = 'menu';
  }
  else if (state === 'blessing') { updateBlessing(); drawBlessing(); if (jp('Escape')) state = 'menu'; }
  else if (state === 'matchend') { drawMatchEnd(); }

  prevKeys = Object.assign({}, keys);
  requestAnimationFrame(loop);
}
function drawWorldFrame() {
  cx.save();
  if (shakeT > 0) {
    shakeT--;
    const k = shakeT / shakeDur;
    cx.translate((Math.random() - 0.5) * shakeMag * k * 2, (Math.random() - 0.5) * shakeMag * k * 2);
    if (shakeT <= 0) shakeMag = 0;
  }
  drawBG(); drawStage();
  players.forEach(drawPlayer);
  drawParticles();
  cx.restore();
  drawHUD();
}
loop();
</script>
